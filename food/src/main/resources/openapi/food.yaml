openapi: 3.0.0
info:
  title: Étel Rendelési API
  description: "API ételek és ételkategóriák nyilvántartására és kezelésére."
  version: 1.0.0

servers:
  - url: https://example-food-api.cloud/api
  - url: http://localhost:8080/api
    description: Helyi fejlesztői szerver

paths:

  /categories:
    get:
      summary: Kategóriák listázása
      description: Lekérdezi az összes ételkategóriát.
      responses:
        "200":
          description: Kategóriák sikeresen lekérdezve
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodCategory"
              example:
                - id: 1
                  name: Levesek
                - id: 2
                  name: Főételek
                - id: 3
                  name: Desszertek

    post:
      summary: Új kategória hozzáadása
      description: Új ételkategóriát hoz létre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodCategory"
      responses:
        "201":
          description: Kategória sikeresen létrehozva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodCategory"
              example:
                id: 4
                name: Italok

  /categories/{id}:
    get:
      summary: Kategória lekérdezése
      description: Lekérdezi egy adott kategóriát ID alapján.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Kategória sikeresen lekérdezve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodCategory"
              example:
                id: 1
                name: Levesek
        "404":
          description: Kategória nem található

    delete:
      summary: Kategória törlése
      description: Törli a kategóriát ID alapján.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Kategória törölve
        "404":
          description: Kategória nem található

  /foods:
    get:
      summary: Ételek listázása
      description: Lekérdezi az összes ételt.
      responses:
        "200":
          description: Ételek sikeresen lekérdezve
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Food"
              example:
                - id: 1
                  name: Gulyásleves
                  categoryId: 1
                  price: 1200
                - id: 2
                  name: Csirkepaprikás
                  categoryId: 2
                  price: 2200
                - id: 3
                  name: Somlói galuska
                  categoryId: 3
                  price: 1500

    post:
      summary: Új étel hozzáadása
      description: Új ételt ad hozzá a rendszerhez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Food"
      responses:
        "201":
          description: Étel sikeresen hozzáadva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
              example:
                id: 4
                name: Csokoládé mousse
                categoryId: 3
                price: 1700

  /foods/{id}:
    get:
      summary: Étel lekérdezése
      description: Lekérdez egy ételt az ID alapján.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Étel sikeresen lekérdezve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
              example:
                id: 1
                name: Gulyásleves
                categoryId: 1
                price: 1200
        "404":
          description: Étel nem található

    put:
      summary: Étel módosítása
      description: Módosítja az étel adatait.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Food"
      responses:
        "200":
          description: Étel sikeresen módosítva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
              example:
                id: 1
                name: Húsleves
                categoryId: 1
                price: 1300
        "404":
          description: Étel nem található

    delete:
      summary: Étel törlése
      description: Törli az ételt az ID alapján.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Étel törölve
        "404":
          description: Étel nem található

components:
  schemas:

    FoodCategory:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          description: Az ételkategória egyedi azonosítója.
          readOnly: true
        name:
          type: string
          description: Az ételkategória neve.
          x-field-extra-annotation: '@hu.oe.yokudlela.food.validation.NameExists(message="error.food.name.exists")'

    Food:
      type: object
      required:
        - name
        - categoryId
        - price
      properties:
        id:
          type: integer
          description: Az étel egyedi azonosítója.
          readOnly: true
        name:
          type: string
          description: Az étel neve.
        categoryId:
          type: integer
          description: Az étel kategóriájának azonosítója.
        price:
          type: integer
          description: Az étel ára forintban.