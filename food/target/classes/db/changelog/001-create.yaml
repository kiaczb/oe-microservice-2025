databaseChangeLog:
  - changeSet:
      id: 001-food-management-tables
      author: Dog
      changes:
        # 1. Ételkategóriák tábla (Ezt hagyhatjuk bigint-en, ahogy beszéltük)
        - createTable:
            tableName: food_category
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

        # 2. Ételek tábla (Itt kell az UUID!)
        - createTable:
            tableName: food
            columns:
              - column:
                  name: id
                  type: uuid # <--- Átírva bigint-ről uuid-ra
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint # Ez marad bigint, mert a food_category id-jára mutat!
                  constraints:
                    nullable: false

        # 3. Idegen kulcs
        - addForeignKeyConstraint:
            baseTableName: food
            baseColumnNames: category_id
            referencedTableName: food_category
            referencedColumnNames: id
            constraintName: FK_FOOD_CATEGORY_ID
            onDelete: CASCADE